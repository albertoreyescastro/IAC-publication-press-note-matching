[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-publication-press-note-matching"
version = "2.0.0"
description = "Reproducible heuristic matching of IAC scientific publication titles to public press notes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Alberto Reyes Castro"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "pandas>=2.1,<3",
  "rapidfuzz>=3.9,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]
notebook = [
  "ipykernel>=6,<8",
  "ipython>=8,<10",
  "nbconvert>=7,<8",
  "nbformat>=5,<6",
]

[project.scripts]
iac-match = "iac_matching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
